{% extends "base.html" %}
{% block title %}Set new password — TelegramMonitor{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Set new password</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="flash flash-success">{{ success }}</div>{% endif %}
  <form method="post" action="/ui/reset/confirm">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="form-group">
      <label for="password">New password (min 8 characters)</label>
      <input type="password" id="password" name="password" required minlength="8" autofocus>
    </div>
    <button type="submit">Set password</button>
  </form>
</div>
{% endblock %}
