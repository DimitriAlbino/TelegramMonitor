{% extends "base.html" %}
{% block title %}{{ 'Edit' if m else 'New' }} Monitor — TelegramMonitor{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ 'Edit' if m else 'Create' }} Monitor</h1>
  <form method="post" action="{{ '/ui/monitors/' ~ m.id ~ '/edit' if m else '/ui/monitors/new' }}">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required value="{{ m.name if m else '' }}" placeholder="e.g. Billing API">
    </div>
    <div class="form-group">
      <label for="check_kind">Check Kind</label>
      <select id="check_kind" name="check_kind" {{ 'disabled' if m }}>
        <option value="http" {{ 'selected' if not m or m.check_kind == 'http' }}>HTTP (GET a URL)</option>
        <option value="tcp" {{ 'selected' if m and m.check_kind == 'tcp' }}>TCP (open host:port)</option>
      </select>
      {% if m %}<p class="text-dim text-sm mt-1">Kind cannot be changed after creation.</p>{% endif %}
    </div>
    <div class="form-group">
      <label for="target">Target</label>
      <input type="text" id="target" name="target" required value="{{ m.target if m else '' }}" placeholder="https://example.com or host:port">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="interval_s">Interval (seconds)</label>
        <input type="number" id="interval_s" name="interval_s" required min="30" value="{{ m.interval_s if m else 30 }}">
      </div>
      <div class="form-group">
        <label for="timeout_s">Timeout (seconds)</label>
        <input type="number" id="timeout_s" name="timeout_s" step="0.5" value="{{ (m.config.timeout_s if m and m.config.timeout_s else 10.0) }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="failure_threshold">Failure Threshold</label>
        <input type="number" id="failure_threshold" name="failure_threshold" min="1" value="{{ m.failure_threshold if m else 3 }}">
      </div>
      <div class="form-group">
        <label for="recovery_threshold">Recovery Threshold</label>
        <input type="number" id="recovery_threshold" name="recovery_threshold" min="1" value="{{ m.recovery_threshold if m else 2 }}">
      </div>
    </div>

    <div id="http-fields">
      <div class="form-row">
        <div class="form-group">
          <label for="expected_status">Expected Status Code</label>
          <input type="number" id="expected_status" name="expected_status" value="{{ m.config.expected_status if m and m.config.expected_status else 200 }}">
        </div>
        <div class="form-group">
          <label for="max_latency_ms">Max Latency (ms, optional)</label>
          <input type="number" id="max_latency_ms" name="max_latency_ms" value="{{ m.config.max_latency_ms if m and m.config.max_latency_ms else '' }}">
        </div>
      </div>
      <div class="form-group">
        <label for="body_contains">Required body keyword (optional)</label>
        <input type="text" id="body_contains" name="body_contains" value="{{ m.config.body_contains if m and m.config.body_contains else '' }}" placeholder="e.g. healthy">
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="follow_redirects" value="true" {{ 'checked' if m and m.config.get('follow_redirects') }}> Follow redirects (accept 301/302 — check the final destination)</label>
      </div>
    </div>

    <div class="form-checks">
      <label><input type="checkbox" name="critical" value="true" {{ 'checked' if m and m.critical }}> Critical (bypasses quiet hours)</label>
      <label><input type="checkbox" name="show_on_status_page" value="true" {{ 'checked' if m and m.show_on_status_page }}> Show on status page</label>
    </div>

    <div class="mt-2">
      <button type="submit">{{ 'Save changes' if m else 'Create monitor' }}</button>
      {% if m %}<a href="/ui/monitors/{{ m.id }}" class="btn-link" style="margin-left:0.75rem">Cancel</a>{% endif %}
    </div>
  </form>
</div>

<script>
document.getElementById('check_kind').addEventListener('change', function() {
  document.getElementById('http-fields').style.display = this.value === 'http' ? '' : 'none';
});
</script>
{% endblock %}
