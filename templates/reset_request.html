{% extends "base.html" %}
{% block title %}Reset password — TelegramMonitor{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Reset password</h1>
  <form method="post" action="/ui/reset/request">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <button type="submit">Send reset link</button>
  </form>
  <div class="auth-links"><a href="/ui/login">Back to login</a></div>
</div>
{% endblock %}
