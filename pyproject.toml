[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgmonitor"
version = "0.1.0"
description = "Hosted monitoring SaaS with Telegram alerts"
requires-python = ">=3.12"
license = { text = "TBD" }
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

# Two entrypoints share one package; the commands live under tgmonitor.api and
# tgmonitor.worker and are launched via `python -m` in Docker Compose.

[tool.hatch.build.targets.wheel]
packages = ["tgmonitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true  # Alembic env/versions are autogenerated and loose
